name: magribi
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run scripts/setup-local.py}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup-local.py}
      POSTGRES_DB: ${POSTGRES_DB:-magribi}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15
  migrate:
    build: {context: ., dockerfile: apps/api/Dockerfile}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-magribi}
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      db: {condition: service_healthy}
  api:
    build: {context: ., dockerfile: apps/api/Dockerfile}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-magribi}
      PORT: 8000
    expose: ["8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/')"]
      interval: 10s
      timeout: 5s
      retries: 10
  web:
    build: {context: ., dockerfile: apps/web/Dockerfile}
    environment:
      API_INTERNAL_URL: http://api:8000
      PORT: 3000
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  postgres_data:
